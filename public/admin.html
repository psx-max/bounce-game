<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080816;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.05)}
  .bar h2{font-weight:200;letter-spacing:3px;font-size:18px}
  .bar .btns{display:flex;gap:10px}
  .bar button{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);padding:7px 16px;border-radius:5px;cursor:pointer;font-size:12px;letter-spacing:1px;transition:all .2s}
  .bar button:hover{color:#fff;border-color:rgba(255,255,255,0.3)}
  .main{padding:24px 28px;max-width:1100px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
  .stat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:20px}
  .stat-card .num{font-size:32px;font-weight:200}
  .stat-card .lbl{color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:1px;margin-top:4px}
  .section{margin-bottom:28px}
  .section h3{font-weight:200;letter-spacing:2px;font-size:15px;margin-bottom:12px;color:rgba(255,255,255,0.5)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 14px;text-align:left;font-size:13px}
  th{color:rgba(255,255,255,0.3);font-weight:400;border-bottom:1px solid rgba(255,255,255,0.06);letter-spacing:1px;font-size:11px}
  td{border-bottom:1px solid rgba(255,255,255,0.03);color:rgba(255,255,255,0.7)}
  .cid{color:#8844ff;cursor:pointer}
  .cid:hover{text-decoration:underline}
  #detail{display:none;position:fixed;inset:0;background:rgba(8,8,22,0.95);z-index:50;overflow-y:auto;padding:40px}
  #detail .close{position:absolute;top:20px;right:30px;font-size:28px;cursor:pointer;color:rgba(255,255,255,0.4)}
  #detail .close:hover{color:#fff}
</style>
</head>
<body>
<div class="bar">
  <h2>BOUNCE GAME · 管理后台</h2>
  <div class="btns">
    <button onclick="refresh()">刷新</button>
    <button onclick="location.href='/'">← 返回主页</button>
    <button onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/')">退出</button>
  </div>
</div>
<div class="main">
  <div class="cards" id="cards"></div>
  <div class="section">
    <h3>玩家排行</h3>
    <table><thead><tr><th>ID</th><th>用户名</th><th>弹跳数</th><th>最高分</th><th>详情</th></tr></thead><tbody id="playerTable"></tbody></table>
  </div>
  <div class="section">
    <h3>最高分记录</h3>
    <table><thead><tr><th>玩家</th><th>分数</th><th>关卡</th><th>时间</th></tr></thead><tbody id="topTable"></tbody></table>
  </div>
</div>
<div id="detail"><span class="close" onclick="document.getElementById('detail').style.display='none'">&times;</span><div id="detailContent"></div></div>

<script>
async function refresh(){
  const s=await fetch('/api/admin/stats').then(r=>r.json());
  document.getElementById('cards').innerHTML=`
    <div class="stat-card"><div class="num">${s.totalPlayers}</div><div class="lbl">总玩家数</div></div>
    <div class="stat-card"><div class="num">${s.totalBounces}</div><div class="lbl">总弹跳记录</div></div>
    <div class="stat-card"><div class="num">${s.todayBounces}</div><div class="lbl">今日弹跳</div></div>
    <div class="stat-card"><div class="num">${s.playerStats.length?Math.max(...s.playerStats.map(p=>p.best||0)):0}</div><div class="lbl">历史最高分</div></div>
  `;
  document.getElementById('playerTable').innerHTML=s.playerStats.map(p=>
    `<tr><td>${p.id}</td><td>${p.username}</td><td>${p.bounces}</td><td>${p.best||'-'}</td><td><span class="cid" onclick="showDetail(${p.id},'${p.username}')">查看</span></td></tr>`
  ).join('');
  document.getElementById('topTable').innerHTML=s.topScores.map(r=>
    `<tr><td>${r.username}</td><td>${r.score}</td><td>${r.level}</td><td>${r.created_at}</td></tr>`
  ).join('');
}

async function showDetail(id,name){
  const d=await fetch('/api/admin/player/'+id).then(r=>r.json());
  const b=d.data.slice(0,200);
  document.getElementById('detailContent').innerHTML=`
    <h2 style="font-weight:200;margin-bottom:8px">${d.player.username}</h2>
    <p style="color:rgba(255,255,255,0.3);font-size:12px;margin-bottom:20px">邮箱: ${d.player.email} · 注册: ${d.player.created_at} · 上次登录: ${d.player.last_login}</p>
    <table><thead><tr><th>#</th><th>关卡</th><th>分数</th><th>轨道</th><th>类型</th><th>车道</th><th>颜色</th><th>X</th><th>速度倍率</th><th>时间</th></tr></thead><tbody>
    ${b.map((r,i)=>`<tr><td>${i+1}</td><td>${r.level}</td><td>${r.score}</td><td>${r.track_index}</td><td>${r.track_type}</td><td>${r.lane}</td><td style="color:${r.ball_color}">● ${r.ball_color}</td><td>${r.pos_x.toFixed(1)}</td><td>${r.speed_mult.toFixed(2)}</td><td>${r.created_at}</td></tr>`).join('')}
    </tbody></table>
  `;
  document.getElementById('detail').style.display='block';
}

refresh();
</script>
</body>
</html>
