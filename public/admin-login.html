<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#080816;font-family:system-ui,sans-serif}
  .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:40px 32px;width:360px;max-width:92vw;backdrop-filter:blur(20px)}
  .card h1{color:#fff;font-size:22px;font-weight:200;letter-spacing:3px;text-align:center;margin-bottom:6px}
  .card .sub{color:rgba(255,255,255,0.2);font-size:11px;text-align:center;margin-bottom:24px}
  .field{margin-bottom:14px}
  .field label{display:block;color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:1px;margin-bottom:6px}
  .field input{width:100%;padding:11px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:7px;color:#fff;font-size:14px;outline:none;transition:border .25s}
  .field input:focus{border-color:rgba(255,255,255,0.25)}
  .btn{width:100%;padding:12px;border:none;border-radius:7px;cursor:pointer;font-size:14px;letter-spacing:2px;color:#fff;background:#8844ff;transition:all .25s}
  .btn:hover{background:#9955ff}
  .msg{text-align:center;font-size:12px;margin-top:12px;min-height:18px}
  .msg.error{color:#ff5555}
  .back{text-align:center;margin-top:16px}
  .back a{color:rgba(255,255,255,0.15);font-size:11px;text-decoration:none;transition:color .2s}
  .back a:hover{color:rgba(255,255,255,0.4)}
</style>
</head>
<body>
<div class="card">
  <h1>管理员登录</h1>
  <div class="sub">ADMIN PANEL</div>
  <div class="field"><label>管理员账号</label><input type="text" id="a-user" placeholder="admin"></div>
  <div class="field"><label>密码</label><input type="password" id="a-pass" placeholder="输入管理员密码"></div>
  <button class="btn" id="btn-admin">登 录</button>
  <div class="msg" id="msg"></div>
  <div class="back"><a href="/">← 返回玩家登录</a></div>
</div>
<script>
document.getElementById('btn-admin').addEventListener('click',async()=>{
  const u=document.getElementById('a-user').value.trim(),p=document.getElementById('a-pass').value;
  if(!u||!p)return;
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(r=>r.json());
  if(r.error){document.getElementById('msg').textContent=r.error;document.getElementById('msg').className='msg error';return}
  location.href='/admin';
});
document.getElementById('a-pass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-admin').click()});
</script>
</body>
</html>
